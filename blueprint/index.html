<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Already dark, in the Omarchy theme's colors: keep the browser and dark-mode
     extensions (Dark Reader) from recoloring it. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Omarchy Blueprint</title>
<style>
/* Colors come from the current Omarchy theme when bin/blueprint renders the
   page (it replaces the theme marker below). These are the fallbacks. */
:root {
  --bg: #1a1b26; --bg-dark: #13141c; --bg-light: #24283b; --sel: #292e42; --muted: #414868;
  --fg: #a9b1d6; --fg-dim: #565f89; --fg-bright: #c0caf5; --accent: #7aa2f7;
  --red: #f7768e; --yellow: #e0af68; --green: #9ece6a; --cyan: #449dab; --magenta: #ad8ee6; --orange: #eb927b;
  /*THEME*/
  --mono: ui-monospace, "JetBrainsMono Nerd Font", "JetBrains Mono", Menlo, monospace;
  --c-carry: var(--green); --c-module: var(--magenta); --c-step: var(--cyan);
  --c-note: var(--yellow); --c-skip: var(--fg-dim); --c-review: var(--orange);
  --line: color-mix(in srgb, var(--fg) 9%, transparent);
}
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto 1fr;
  grid-template-areas: "aside hero" "aside main"; min-height: 100vh; max-width: 1280px; margin: 0 auto; }

/* The header: the mark, the name, and the machine this blueprint was drawn from,
   on a faint blueprint grid. */
.hero { grid-area: hero; display: flex; gap: 26px; align-items: center; margin: 28px 28px 8px 8px; padding: 34px 36px;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius: 22px;
  background:
    linear-gradient(color-mix(in srgb, var(--accent) 7%, transparent) 1px, transparent 1px) -1px -1px / 26px 26px,
    linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent) 1px, transparent 1px) -1px -1px / 26px 26px,
    radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 16%, var(--bg-dark)), var(--bg-dark) 65%); }
h1 { margin: 0; font: 750 38px/1.05 system-ui, sans-serif; letter-spacing: -.025em; color: var(--fg-bright); }
h1 span { color: var(--accent); }
.tagline { margin: 10px 0 16px; font-size: 16.5px; color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 12.5px var(--mono); color: var(--fg); padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-dark) 70%, transparent); }
/* The mark: a tiled desktop drawn as a blueprint, in the theme's accent. */
.logo { width: 92px; height: 92px; flex: none; filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--accent) 22%, transparent)); }
.logo .sheet { fill: color-mix(in srgb, var(--accent) 12%, var(--bg-dark)); stroke: color-mix(in srgb, var(--accent) 40%, transparent); }
.logo .grid { stroke: color-mix(in srgb, var(--accent) 16%, transparent); stroke-width: .5; }
.logo .tile { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); stroke-width: 1.4; }
.logo .dim { stroke: color-mix(in srgb, var(--accent) 70%, transparent); stroke-width: .8; fill: none; }
aside { grid-area: aside; position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column;
  padding: 28px 24px 22px; }
/* The controls follow the tree directly; a tree taller than the window scrolls. */
.built { flex: 0 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim); margin: 0 0 8px; }
.tree { font: 12px/1.8 var(--mono); white-space: pre; overflow-x: auto; color: var(--fg-dim); }
.tree .line { cursor: pointer; display: block; border-radius: 4px; }
.tree .line:hover { color: var(--fg); }
.tree .line.active { background: var(--sel); box-shadow: -6px 0 0 var(--sel), 6px 0 0 var(--sel); color: var(--fg-bright); }
.tree .n { color: var(--fg); }
.hint { font-size: 12px; color: var(--fg-dim); margin-top: 14px; }

main { grid-area: main; min-width: 0; padding: 0 28px 80px 8px; }
.controls { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.tabs button { display: flex; justify-content: space-between; align-items: baseline; background: none; border: 0;
  border-radius: 8px; padding: 6px 10px; font-size: 14.5px; color: var(--fg-dim); text-align: left; }
.tabs button:hover { color: var(--fg); background: color-mix(in srgb, var(--sel) 50%, transparent); }
.tabs button[aria-pressed="true"] { color: var(--fg-bright); background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
.tabs .n { font: 12px var(--mono); }
.controls input[type=search] { width: 100%; background: var(--bg-dark); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; outline: none; font-size: 14px; }
.controls input[type=search]:focus { border-color: var(--accent); }
.actions { display: flex; align-items: center; gap: 14px; }
.actions .btn { flex: 1; }
.status { font-size: 12px; color: var(--fg-dim); min-height: 1em; }
.status.error { color: var(--red); }
.btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 14.5px; }
.btn:hover { border-color: var(--fg-dim); }
.btn.primary { background: var(--fg-bright); color: var(--bg); border-color: var(--fg-bright); font-weight: 600; }
.link { background: none; border: 0; padding: 0; color: var(--fg-dim); font-size: 14px; }
.link:hover { color: var(--fg); }

section { margin-top: 26px; }
section h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim);
  margin: 0 0 10px; padding: 0 4px; }
section h2 span { margin-left: 6px; }
.row { background: var(--bg-dark); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px;
  transition: border-color .12s; }
.row:hover { border-color: color-mix(in srgb, var(--fg) 20%, transparent); }
.row.open { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.head { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 20px 24px 12px; cursor: pointer; border-radius: 16px 16px 0 0; }
.head:focus-visible { outline: 1px solid var(--accent); }
.name { flex: 1; min-width: 0; font: 19px var(--mono); color: var(--fg-bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.left .name { color: var(--fg); }
.you { font-size: 12.5px; color: var(--accent); }
.chev { width: 20px; text-align: center; font-size: 20px; color: var(--fg-dim); }
.head:hover .chev { color: var(--fg); }

.detail { padding: 4px 0 26px; border-top: 1px solid var(--line); margin: 0 24px; }
.part { margin-top: 24px; }
.part > .label { margin-bottom: 8px; font-size: 12.5px; }
.what { margin: 0; font-size: 22px; line-height: 1.45; color: var(--fg-bright); }
.where { margin: 6px 0 0; font: 15px var(--mono); color: var(--fg-dim); word-break: break-all; }
.why { margin: 0; font-size: 19px; line-height: 1.5; color: var(--fg-bright); }
.reason { margin: 6px 0 0; font-size: 15.5px; color: var(--fg-dim); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 24px 20px; cursor: pointer; }
.opts button { border: 1px solid var(--line); background: none; padding: 4px 12px; border-radius: 99px; font-size: 13px; }
.opts button:hover { border-color: var(--c); }
.opts button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--bg-dark); font-weight: 600; }
.opts button[aria-pressed="true"][data-pick="skip"] { background: var(--muted); border-color: var(--muted); color: var(--fg-bright); }
.effect { margin: 0; font-size: 17px; }
.effect.preview { color: var(--fg-dim); font-style: italic; }
.effect .to { display: block; font: 14px var(--mono); color: var(--fg-dim); margin-top: 3px; }
.effect .mod { display: block; margin-top: 10px; font-size: 14px; color: var(--fg-dim); }
.effect input { width: 130px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 1px 4px; font: 14px var(--mono); margin-left: 8px; outline: none; }
.foot { display: flex; gap: 16px; align-items: baseline; margin-top: 18px; }
.foot summary { cursor: pointer; font-size: 14px; color: var(--fg-dim); }
.foot details[open] { flex-basis: 100%; }
.foot pre { margin: 8px 0 0; font: 11.5px var(--mono); color: var(--fg-dim); white-space: pre-wrap; word-break: break-all; max-height: 280px; overflow: auto; }
.empty { padding: 48px 10px; color: var(--fg-dim); }
.empty.finished { font-size: 18px; line-height: 1.6; color: var(--fg-bright); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "hero" "aside" "main"; }
  .hero { margin: 16px 12px 0; padding: 22px 20px; gap: 16px; }
  .logo { width: 58px; height: 58px; }
  h1 { font-size: 27px; }
  .tagline { font-size: 15px; margin: 6px 0 12px; }
  aside { position: static; height: auto; padding: 20px 16px 0; }
  .built { overflow: visible; }
  main { padding: 0 12px 60px; }
  .head { padding: 16px 16px 10px; }
  .opts { padding: 0 16px 16px; }
  .detail { margin: 0 16px; }
  .name { font-size: 16px; }
}
</style>
</head>
<body>
<div class="layout">
  <header class="hero">
    <svg class="logo" id="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect class="sheet" x=".5" y=".5" width="31" height="31" rx="6"/>
      <path class="grid" d="M6 1v30M11 1v30M16 1v30M21 1v30M26 1v30M1 6h30M1 11h30M1 16h30M1 21h30M1 26h30"/>
      <path class="dim" d="M7 5.5h18M7 4v3M25 4v3"/>
      <rect class="tile" x="7" y="9" width="8" height="17" rx="1.2"/>
      <rect class="tile" x="17" y="9" width="8" height="7.5" rx="1.2"/>
      <rect class="tile" x="17" y="18.5" width="8" height="7.5" rx="1.2"/>
    </svg>
    <div>
      <h1>Omarchy <span>Blueprint</span></h1>
      <p class="tagline">Your setup, drawn up for the next machine.</p>
      <div class="chips" id="machine"></div>
    </div>
  </header>
  <aside>
    <div class="built">
      <p class="label">What gets built</p>
      <div class="tree" id="tree"></div>
      <p class="hint">Click a line to see what lands there.</p>
    </div>
    <div class="controls">
      <div class="tabs" id="tabs"></div>
      <input type="search" id="q" placeholder="Filter">
      <div class="actions">
        <button class="btn primary" id="save" title="Download decisions.json for your agent">Save decisions</button>
        <button class="link" id="copy" title="Copy decisions as JSON">Copy</button>
      </div>
      <span class="status" id="status"></span>
    </div>
  </aside>
  <main>
    <div id="list"></div>
  </main>
</div>

<script type="application/json" id="inventory">/*INVENTORY*/</script>
<script type="application/json" id="decisions">/*DECISIONS*/</script>
<script type="application/json" id="served">/*SERVED*/</script>
<script>
(() => {
  const read = id => { try { return JSON.parse(document.getElementById(id).textContent); } catch { return null; } };
  const inv = read('inventory') || { items: [], machine: {}, omarchy: {} };
  const shipped = read('decisions');

  // What each class means, in the words the chips and reset buttons use.
  const CLASSES = {
    carry:  { label: 'every machine' },
    module: { label: 'this hardware only' },
    step:   { label: 'setup asks' },
    note:   { label: 'README only' },
    skip:   { label: 'left out' },
    review: { label: 'undecided' },
  };
  const GROUPS = [
    ['package', 'Packages'], ['package-removed', 'Removed Omarchy packages'],
    ['config', 'Configs'], ['desktop-entry', 'Desktop entries'], ['config-dir', 'App folders'],
    ['system-file', 'System files'], ['masked-unit', 'Masked units'], ['service', 'Services'], ['user-unit', 'User units'],
    ['repo', 'Repos'], ['plugin', 'Shell plugins'], ['link', 'Command links'], ['command', 'Scripts'],
    ['tool', 'Tools outside mise'], ['identity', 'Logins and keys'], ['credential', 'Credential files'],
    ['personal-data', 'Personal data'],
  ];

  // Served by bin/blueprint: every choice is saved to out/decisions.json as it is
  // made. Opened as a file: this browser keeps the edits until "Save decisions".
  const served = read('served') === true;
  const KEY = 'omarchy-blueprint:' + (inv.generated || '');
  let mine = {};
  if (!served) try { mine = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
  const agent = shipped && shipped.decisions || {};
  const decisions = Object.assign({}, agent, mine);
  let saveError = '', saveTimer, finished = false;
  const persist = () => {
    if (!served) { try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch {} return; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => save(false), 250);
  };
  async function save(done) {
    clearTimeout(saveTimer);
    try {
      const r = await fetch('decisions' + (done ? '?done' : ''), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: exportJSON() });
      if (!r.ok) throw new Error(await r.text());
      saveError = '';
    } catch (e) {
      saveError = /^Not saved/.test(e.message) ? e.message : 'Not saved: bin/blueprint is not running.';
    }
    header();
    return !saveError;
  }

  const eff = it => {
    const d = decisions[it.id];
    return { cls: d ? d.class : it.class, module: d ? (d.module || null) : it.module };
  };

  // Where each kept item lands in the generated repo.
  function target(it, e) {
    const f = it.facts || {};
    if (e.cls === 'skip' || e.cls === 'review') return null;
    if (e.cls === 'note') return ['README.md', 'not carried'];
    if (e.cls === 'step') return ['bootstrap.sh', 'steps'];
    const file = e.cls === 'module' ? `mise.${e.module || 'machine'}.toml` : 'mise.toml';
    switch (it.kind) {
      case 'package': return [file, 'packages'];
      case 'package-removed': return [file, 'task: removals'];
      case 'system-file': case 'user-unit': return [file, 'files'];
      case 'service': case 'masked-unit': return [file, 'services'];
      case 'repo': return [file, 'repos'];
      case 'plugin':
        if (f.deploy === 'git') return [file, 'repos'];
        if (f.deploy === 'copy') return [file, 'dotfiles'];
        return [file, 'task: plugins'];
      case 'link': return [file, 'task: links'];
      case 'command': return [file, 'files'];
      case 'tool': return ['mise.toml', 'tools'];
      case 'config': return it.name === '~/.config/mise/config.toml' ? [file, 'dotfiles (tools)'] : [file, 'dotfiles'];
      default: return [file, 'dotfiles'];
    }
  }

  let filter = { tab: 'decide', q: '', cls: null, target: null };
  // Items changed in the current view stay in it, so a click changes the
  // selection instead of making the row vanish. Cleared when the view changes.
  let pinned = new Set();
  // Rows the person has opened. Collapsed, a row is its name and its choices.
  const expanded = new Set();
  if (!inv.items.some(it => eff(it).cls === 'review')) filter.tab = 'kept';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);

  function header() {
    const m = inv.machine || {};
    $('machine').innerHTML = [
      [m.vendor, m.product && m.product.replace(/\s*\(.*\)$/, '')].filter(Boolean).join(' ') || 'Unknown machine',
      `Omarchy ${inv.omarchy?.version || '?'}`,
    ].map(t => `<span class="chip">${esc(t)}</span>`).join('');
    const changed = Object.values(decisions).filter(d => d.by === 'you').length;
    const parts = changed ? [`${changed} changed by you`] : [];
    if (served) parts.push(saveError || 'Saved as you go');
    $('status').textContent = parts.join(' · ');
    $('status').classList.toggle('error', !!saveError);
  }

  function tree() {
    const files = {};
    inv.items.forEach(it => {
      const t = target(it, eff(it));
      if (!t) return;
      (files[t[0]] ||= {})[t[1]] = ((files[t[0]] || {})[t[1]] || 0) + 1;
    });
    const order = Object.keys(files).sort((a, b) => {
      const rank = f => f === 'mise.toml' ? 0 : f.startsWith('mise.') ? 1 : f === 'bootstrap.sh' ? 2 : 3;
      return rank(a) - rank(b) || a.localeCompare(b);
    });
    // The repo itself is everything kept: the same as the Kept tab.
    const all = filter.tab === 'kept' && !filter.cls && !filter.target;
    let out = `<span class="line${all ? ' active' : ''}" data-tab="kept">my-omarchy/</span>`;
    order.forEach((f, i) => {
      const last = i === order.length - 1;
      out += line(`${last ? '└──' : '├──'} ${f}`, f, null);
      const RANK = ['packages', 'files', 'services', 'repos', 'dotfiles', 'dotfiles (tools)', 'tools',
        'task: links', 'task: plugins', 'task: removals', 'steps', 'not carried'];
      const parts = Object.entries(files[f]).sort((a, b) => RANK.indexOf(a[0]) - RANK.indexOf(b[0]));
      parts.forEach(([part, n], j) => {
        const pre = (last ? '    ' : '│   ') + (j === parts.length - 1 ? '└── ' : '├── ');
        out += line(`${pre}${part} <span class="n">${n}</span>`, f, part, true);
      });
    });
    out += `    + the carried files`;
    $('tree').innerHTML = out;
    function line(html, file, part, raw) {
      const active = filter.target && filter.target[0] === file && (filter.target[1] === part);
      return `<span class="line${active ? ' active' : ''}" data-file="${esc(file)}" data-part="${esc(part || '')}">${raw ? html : esc(html)}</span>`;
    }
  }

  // The hardware module name to offer: one already in use, or the vendor.
  function defaultModule() {
    const used = inv.items.map(it => eff(it).module).find(Boolean);
    if (used) return used;
    const v = (inv.machine?.vendor || 'machine').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return v || 'machine';
  }
  const pretty = m => (m || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // How a package gets installed: Omarchy's own installer command, Omarchy's
  // package repo, an Arch repo, or the AUR. Shown on the item, not on the buttons.
  // A package Omarchy has an installer for uses it, unless it was decided to
  // install the plain package (Tailscale's installer also signs in).
  function viaInstaller(it) {
    return !!(it.facts || {}).installer && !['carry', 'module'].includes(eff(it).cls);
  }
  function pkgSource(it) {
    const f = it.facts || {};
    if (viaInstaller(it)) return `built into Omarchy (${f.installer})`;
    if (f.in_aur === false) return 'a local build (not in the AUR)';
    if (f.source === 'aur') return 'the AUR';
    if (f.repo === 'omarchy') return "Omarchy's package repo";
    if (f.repo) return `Arch's ${f.repo} repo`;
    return f.source === 'pacman' ? 'pacman' : '';
  }

  // The outcomes that make sense for an item, worded for its kind.
  function choices(it) {
    const f = it.facts || {};
    const hw = pretty(it.module || defaultModule());
    const only = `Only on ${hw}`;
    const isRepo = it.kind === 'repo' || f.deploy === 'git' || f.deploy === 'clone';
    switch (it.kind) {
      case 'package':
        // A package Omarchy has an installer for is installed by running it.
        return viaInstaller(it)
          ? [['step', 'Install everywhere'], ['skip', "Don't install"]]
          : [['carry', 'Install everywhere'], ['module', `Install only on ${hw}`], ['skip', "Don't install"]];
      case 'package-removed':
        return [['carry', 'Remove it on new machines too'], ['module', `Remove it only on ${hw}`], ['skip', 'Ignore']];
      case 'service': case 'masked-unit':
        return [['carry', it.kind === 'masked-unit' ? 'Mask everywhere' : 'Enable everywhere'], ['module', only], ['skip', 'Leave as Omarchy has it']];
      case 'identity':
        return [['step', 'Setup asks for it'], ['note', 'Mention in README'], ['skip', 'Ignore'],
          ...(it.name === 'ssh-config' ? [['carry', 'Copy everywhere']] : [])];
      case 'credential': case 'personal-data':
        return [['note', 'Mention in README'], ['skip', 'Ignore']];
      case 'tool':
        return [['carry', 'Install with mise everywhere'], ['skip', "Don't install"]];
      case 'link':
        return [['carry', 'Recreate everywhere'], ['module', only], ['skip', 'Leave out']];
      case 'repo':
        return [['carry', 'Clone everywhere'], ['module', `Clone only on ${hw}`], ['note', 'Mention in README'], ['skip', "Don't clone"]];
      case 'config-dir':
        return [['note', 'Mention in README'], ['carry', 'Copy the whole folder'], ['module', only], ['skip', 'Leave out']];
      default:
        return [['carry', isRepo ? 'Install everywhere' : 'Copy everywhere'], ['module', only],
          ['note', 'Mention in README'], ['skip', 'Leave out']];
    }
  }

  // The choices, plus the current outcome if an agent picked one the list does not offer.
  function withCurrent(it, e) {
    const list = choices(it);
    if (e.cls === 'review' || list.some(([c]) => c === e.cls)) return list;
    const generic = { carry: 'Copy everywhere', module: 'This hardware only', step: 'Setup asks', note: 'Mention in README', skip: 'Leave out' };
    return [...list, [e.cls, generic[e.cls]]];
  }

  // One sentence: what happens to this item on a new machine with this choice.
  function effect(it, cls, module) {
    const f = it.facts || {};
    const where = cls === 'module' ? `on ${pretty(module)} machines` : 'on every machine';
    const name = it.name;
    const path = f.path || name;
    switch (cls) {
      case 'review': return 'Undecided. Pick what should happen to it on a new machine.';
      case 'skip':
        return it.kind === 'package' ? 'Not installed on new machines.'
          : it.kind === 'service' ? 'Left as Omarchy has it: not enabled by this setup.'
          : 'Left out. A new machine gets whatever Omarchy gives it.';
      case 'note': return 'Not carried, but listed in the README under "Not carried here", so you remember to deal with it.';
      case 'step':
        if (f.installer) return `bootstrap.sh runs Omarchy's own installer, ${f.installer}, ${(decisions[it.id] || {}).first
          ? 'before mise bootstrap, because something carried needs it'
          : 'at the end, once the base system is set up'}. It also does the setup the package alone does not.`;
        return ({
          github: 'bootstrap.sh signs you in to GitHub first, so private repos can be cloned.',
          'ssh-keys': 'bootstrap.sh offers to create a new SSH key at the start, or you restore yours from a backup.',
          tailscale: 'bootstrap.sh checks the connection. Joining (sudo tailscale up, as a new device) is listed at the end, for when you have a moment.',
          fingerprint: 'bootstrap.sh checks for an enrolled finger. Enrolling on the new reader is listed at the end, for when you have a moment.',
        })[name] || 'bootstrap.sh shows it as a to-do you tick off by hand.';
    }
    switch (it.kind) {
      case 'package': return `mise installs ${name}${f.source === 'aur' ? ', building it from the AUR,' : ' with pacman'} ${where}.`;
      case 'package-removed': return `The bootstrap task gets a removal of ${name} ${where}, commented out until you enable it.`;
      case 'service':
        return `${f.unit || name} is enabled ${where}` + (/oneshot/.test(it.reason) ? ', and runs from its own trigger.' : ' and started.');
      case 'masked-unit': return `${name} is masked ${where}, so it never starts.`;
      case 'system-file': return `Your copy is kept in the repo and installed at ${path} ${where}, owned by ${f.owner || 'root'}.`;
      case 'user-unit': case 'command': return `Your copy is kept in the repo and installed at ${path} ${where}.`;
      case 'repo':
        return f.reachable === false
          ? `Setup tries to clone ${f.url} into ${path} ${where}, and moves on if it cannot.`
          : `${f.url || 'It'} is cloned into ${path} ${where}.`;
      case 'plugin':
        if (f.deploy === 'git') return f.reachable === false
          ? `Setup tries to clone it from ${f.url} ${where}, and moves on if it cannot.`
          : `Cloned from ${f.url} into ${path} ${where}.`;
        if (f.deploy === 'clone') return `Cloned from your checkout (${f.url}) ${where}, once that repo is in place.`;
        if (f.deploy === 'rsync' || f.deploy === 'link') return `Copied from ${f.source} into ${path} ${where}, once that repo is in place.`;
        return `Your copy of the folder is kept in the repo and written to ${path} ${where}.`;
      case 'link': return `${path} is linked to ${f.target} ${where}.`;
      case 'tool': return `mise installs ${f.mise} ${where}.`;
      default:
        if (f.tools) return `Your copy is written to ${path} ${where}, and mise installs its ${f.tools.length} tools.`;
        return `Your current copy is kept in the repo and written to ${path} ${where}, replacing what is there.`;
    }
  }

  // What an item is, in plain words: a kind, a description and where it lives.
  const KIND = {
    package: 'Package', 'package-removed': 'Omarchy package you removed', config: 'Config file',
    'config-dir': 'App folder', 'desktop-entry': 'App launcher', 'system-file': 'System file',
    'masked-unit': 'Masked systemd unit', service: 'Service', 'user-unit': 'User systemd unit', repo: 'Git repo',
    plugin: 'Omarchy shell plugin', link: 'Command link', command: 'Script', tool: 'Tool installed outside mise',
    identity: 'Login or key', credential: 'Credential file', 'personal-data': 'Personal data',
  };
  function whatItIs(it) {
    const f = it.facts || {};
    const app = (it.name.match(/\.config\/([^/]+)/) || [])[1];
    const kind = KIND[it.kind] || it.kind;
    let what = f.description || '', where = f.path && f.path !== it.name ? f.path : '';
    switch (it.kind) {
      case 'package': what ||= `The ${it.name} package.`; where = 'From ' + pkgSource(it); break;
      case 'config': what = app ? `A settings file for ${app}.` : 'A settings file in your home folder.'; where = f.path || it.name; break;
      case 'config-dir': what = `A folder of ${f.files ?? '?'} files (${f.kb ?? '?'} KB)${app ? ' belonging to ' + app : ''}.`; where = f.path || it.name; break;
      case 'desktop-entry': what = `The launcher for ${f.title || it.name}${f.exec ? ', which runs ' + f.exec.split(' ')[0].split('/').pop() : ''}.`; where = f.path; break;
      case 'service': what = `${f.scope === 'user' ? 'A user' : 'A system'} service you enabled.`; where = f.unit_file || ''; break;
      case 'repo': what = f.url ? `A clone of ${f.url}${f.branch ? ', on ' + f.branch : ''}.` : 'A git repo with no remote.'; where = f.path; break;
      case 'plugin': what = `A plugin in your Omarchy bar or shell${f.source ? ', deployed from ' + f.source : ''}.`; where = f.path; break;
      case 'link': what = `A command on your PATH that points to ${f.target}.`; where = f.path; break;
      case 'command': what = f.wraps ? `A wrapper script around ${f.wraps}.` : 'A script you wrote, on your PATH.'; where = f.path; break;
      case 'system-file': what = f.package ? `A file from the ${f.package} package that you changed.` : 'A file in /etc that no package owns.'; where = f.path; break;
    }
    return { kind, what: what || it.name, where };
  }

  function visible(it) {
    const e = eff(it);
    if (pinned.has(it.id)) return true;
    if (filter.cls && e.cls !== filter.cls) return false;
    if (filter.target) {
      const t = target(it, e);
      if (!t || t[0] !== filter.target[0] || (filter.target[1] && t[1] !== filter.target[1])) return false;
    } else if (!filter.cls) {
      if (filter.tab === 'decide' && !(it.class === 'review' || decisions[it.id])) return false;
      if (filter.tab === 'kept' && (e.cls === 'skip' || e.cls === 'review')) return false;
      if (filter.tab === 'left' && e.cls !== 'skip') return false;
    }
    if (filter.q) {
      const hay = (it.name + ' ' + it.reason + ' ' + JSON.stringify(it.facts)).toLowerCase();
      if (!hay.includes(filter.q)) return false;
    }
    return true;
  }

  function list() {
    const tabs = [['decide', 'To decide'], ['kept', 'Kept'], ['left', 'Left out'], ['all', 'All']];
    const n = {
      decide: inv.items.filter(it => it.class === 'review' || decisions[it.id]).length,
      kept: inv.items.filter(it => !['skip', 'review'].includes(eff(it).cls)).length,
      left: inv.items.filter(it => eff(it).cls === 'skip').length,
      all: inv.items.length,
    };
    $('tabs').innerHTML = tabs.map(([k, l]) =>
      `<button data-tab="${k}" aria-pressed="${filter.tab === k && !filter.cls && !filter.target}">${l}<span class="n">${n[k]}</span></button>`).join('');

    const items = inv.items.filter(visible);
    if (!items.length) { $('list').innerHTML = `<div class="empty">Nothing here.${filter.tab === 'decide' ? ' Every item has a decision.' : ''}</div>`; return; }
    const known = GROUPS.map(g => g[0]);
    const groups = [...GROUPS, ...[...new Set(items.map(i => i.kind))].filter(k => !known.includes(k)).map(k => [k, k])];
    const modules = [...new Set(inv.items.map(it => eff(it).module).filter(Boolean))];
    let html = `<datalist id="modules">${modules.map(m => `<option value="${esc(m)}">`).join('')}</datalist>`;
    groups.forEach(([kind, title]) => {
      const rows = items.filter(i => i.kind === kind);
      if (!rows.length) return;
      html += `<section><h2>${esc(title)}<span>${rows.length}</span></h2>`;
      rows.forEach(it => { html += row(it); });
      html += '</section>';
    });
    $('list').innerHTML = html;
  }

  function row(it) {
    const e = eff(it), d = decisions[it.id], f = it.facts || {};
    const open = expanded.has(it.id);
    const byYou = d && d.by === 'you';
    let html = `<div class="row${open ? ' open' : ''}${e.cls === 'skip' ? ' left' : ''}" data-id="${esc(it.id)}" style="--c:var(--c-${e.cls})">
      <button class="head" data-toggle aria-expanded="${open}">
        <span class="name" title="${esc(it.name)}">${esc(it.name)}</span>
        ${byYou ? '<span class="you" title="Changed by you">changed</span>' : ''}
        <span class="chev" aria-hidden="true">${open ? '−' : '+'}</span>
      </button>
      <div class="opts" data-toggle>${withCurrent(it, e).map(([c, label]) => `<button data-pick="${c}" style="--c:var(--c-${c})" aria-pressed="${e.cls === c}">${esc(label)}</button>`).join('')}</div>`;
    if (open) {
      const w = whatItIs(it);
      const why = d && d.why;
      html += `<div class="detail">
        <div class="part">
          <p class="label">${esc(w.kind)}</p>
          <p class="what">${esc(w.what)}</p>
          ${w.where ? `<p class="where">${esc(w.where)}</p>` : ''}
        </div>
        <div class="part">
          <p class="label">Why</p>
          <p class="why">${esc(why || it.reason)}</p>
          ${why ? `<p class="reason">The inspector said: ${esc(it.reason)}</p>` : ''}
        </div>
        <div class="part">
          <p class="label">On a new machine</p>
          <p class="effect" data-effect>${effectHTML(it, e.cls, e.module)}</p>
        </div>
        <div class="foot">
          ${byYou ? `<button class="link" data-reset="${esc(it.id)}" title="Back to ${agent[it.id] ? 'the agent' : 'the inspector'}'s proposal">↺ undo</button>` : ''}
          <details><summary>All facts</summary><pre>${esc(JSON.stringify(f, null, 2))}</pre></details>
        </div>
      </div>`;
    }
    return html + '</div>';
  }

  function effectHTML(it, cls, module) {
    const t = target(it, { cls, module });
    let html = esc(effect(it, cls, module || defaultModule()));
    if (t) html += `<span class="to">In ${esc(t[0])} › ${esc(t[1])}</span>`;
    if (cls === 'module' && module !== undefined)
      html += `<label class="mod">Hardware module <input list="modules" data-module value="${esc(module || '')}" title="Machines that match this module get the item. Use one name per kind of machine."></label>`;
    return html;
  }

  const render = () => { header(); tree(); list(); };

  (function favicon() {
    const svg = document.getElementById('logo').cloneNode(true);
    const live = document.getElementById('logo').querySelectorAll('*');
    svg.querySelectorAll('*').forEach((el, i) => {
      const cs = getComputedStyle(live[i]);
      for (const k of ['fill', 'stroke', 'stroke-width']) el.setAttribute(k, cs.getPropertyValue(k));
    });
    svg.removeAttribute('class'); svg.removeAttribute('id');
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const link = document.createElement('link');
    link.rel = 'icon';
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg.outerHTML);
    document.head.appendChild(link);
  })();

  // Hovering a choice previews what it would do, without changing anything.
  document.addEventListener('mouseover', ev => {
    const b = ev.target.closest('.opts button');
    if (!b) return;
    const row = b.closest('.row'), it = inv.items.find(i => i.id === row.dataset.id), e = eff(it);
    if (b.dataset.pick === e.cls) return;
    const box = row.querySelector('[data-effect]');
    if (!box) return;
    box.classList.add('preview');
    box.innerHTML = esc(effect(it, b.dataset.pick, defaultModule()));
  });
  document.addEventListener('mouseout', ev => {
    const b = ev.target.closest('.opts button');
    if (!b || b.contains(ev.relatedTarget)) return;
    const row = b.closest('.row'), it = inv.items.find(i => i.id === row.dataset.id), e = eff(it);
    const box = row.querySelector('[data-effect]');
    if (!box) return;
    box.classList.remove('preview');
    box.innerHTML = effectHTML(it, e.cls, e.module);
  });

  function decide(id, cls, module) {
    const it = inv.items.find(i => i.id === id);
    if (!it) return;
    pinned.add(id);
    if (cls === 'module' && !module) module = eff(it).module || it.module || defaultModule();
    const a = agent[id];
    if (a && cls === a.class && (cls !== 'module' || module === a.module)) decisions[id] = a;
    else if (!a && cls === it.class && (cls !== 'module' || module === it.module)) delete decisions[id];
    else decisions[id] = cls === 'module' ? { class: cls, module, by: 'you' } : { class: cls, by: 'you' };
    persist();
    render();
  }

  document.addEventListener('click', ev => {
    if (finished) return;
    const t = ev.target.closest('[data-toggle],[data-pick],[data-reset],[data-tab],[data-cls],.line');
    if (!t) return;
    if (t.dataset.toggle !== undefined) {
      const id = t.closest('.row').dataset.id;
      expanded.has(id) ? expanded.delete(id) : expanded.add(id);
      pinned.add(id); list();
    }
    else if (t.dataset.pick) decide(t.closest('.row').dataset.id, t.dataset.pick);
    else if (t.dataset.reset) {
      const id = t.dataset.reset;
      pinned.add(id); agent[id] ? decisions[id] = agent[id] : delete decisions[id]; persist(); render();
    }
    else if (t.dataset.tab) { pinned = new Set(); filter = { ...filter, tab: t.dataset.tab, cls: null, target: null }; render(); }
    else if (t.dataset.cls) { pinned = new Set(); filter.cls = filter.cls === t.dataset.cls ? null : t.dataset.cls; filter.target = null; render(); }
    else if (t.classList.contains('line')) {
      const next = [t.dataset.file, t.dataset.part || null];
      const same = filter.target && filter.target[0] === next[0] && filter.target[1] === next[1];
      pinned = new Set(); filter.target = same ? null : next; filter.cls = null; render();
    }
  });
  document.addEventListener('change', ev => {
    if (ev.target.matches('[data-module]')) {
      const m = ev.target.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-') || 'machine';
      decide(ev.target.closest('.row').dataset.id, 'module', m);
    }
  });
  $('q').addEventListener('input', ev => { filter.q = ev.target.value.trim().toLowerCase(); list(); });

  const exportJSON = () => JSON.stringify({ schema: 1, inventory: inv.generated, decisions }, null, 2) + '\n';
  if (served) {
    // Saved as you go: Done only tells bin/blueprint, and your agent, that you are finished.
    $('save').textContent = 'Done';
    $('save').title = 'Finish: your agent takes it from here';
    $('copy').hidden = true;
  }
  $('save').addEventListener('click', async () => {
    if (served) {
      if (!await save(true)) return;
      finished = true;
      document.querySelectorAll('aside button, aside input').forEach(el => el.disabled = true);
      $('status').textContent = '';
      $('list').innerHTML = '<div class="empty finished">Done. Your decisions are saved, and your agent takes it from here.<br>You can close this tab.</div>';
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([exportJSON()], { type: 'application/json' }));
    a.download = 'decisions.json';
    a.click();
    $('status').textContent = 'Saved to Downloads. Tell your agent.';
  });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(exportJSON()); $('status').textContent = 'Copied. Paste it to your agent.'; }
    catch { $('status').textContent = 'Copy failed: use Save instead.'; }
  });

  render();
})();
</script>
</body>
</html>
